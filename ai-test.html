<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مصحح التلاوة الذكي - نموذج تجريبي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .quran-text {
      font-family: 'Amiri', serif;
      font-size: 2.5rem;
      line-height: 2;
    }

    /* تأثير النبض لزر التسجيل */
    .recording-pulse {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <div class="max-w-2xl w-full bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl p-8 border border-white/50 text-center">
    
    <div id="unsupported-warning" class="hidden mb-6 bg-red-100 text-red-700 p-4 rounded-xl font-bold">
      متصفحك لا يدعم التعرف على الصوت. يرجى استخدام متصفح Chrome أو Edge.
    </div>

    <!-- رأس الصفحة -->
    <h1 class="text-3xl font-black text-sky-800 mb-2">مصحح التلاوة الذكي 🎙️</h1>
    <p class="text-sky-600/80 font-bold mb-8">اقرأ الآية بصوت واضح، وسأخبرك بمدى تطابقها!</p>

    <!-- الآية المعروضة -->
    <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-8 mb-8 relative">
      <span class="absolute -top-3 right-6 bg-amber-400 text-amber-900 font-black px-4 py-1 rounded-full text-sm shadow-md">
        سورة الإخلاص
      </span>
      <p id="target-ayah" class="quran-text text-slate-800 font-bold">
        قُلْ هُوَ اللَّهُ أَحَدٌ
      </p>
    </div>

    <!-- زر التسجيل -->
    <div class="flex justify-center mb-6">
      <button 
        id="record-btn" 
        class="w-24 h-24 bg-sky-500 hover:bg-sky-600 text-white rounded-full shadow-lg shadow-sky-500/30 flex items-center justify-center transition-all active:scale-95"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>

    <p id="status-text" class="text-slate-500 font-bold mb-6 h-6">جاهز للتسجيل...</p>

    <!-- النتيجة -->
    <div id="result-box" class="hidden flex-col items-center gap-4 p-6 bg-slate-50 rounded-2xl border border-slate-200">
      <div id="score-ring" class="w-24 h-24 rounded-full border-8 border-emerald-400 flex items-center justify-center text-2xl font-black text-emerald-600">
        100%
      </div>
      <p id="feedback-msg" class="text-2xl font-black"></p>
      
      <div class="w-full text-right mt-2 bg-white p-4 rounded-xl border border-slate-100">
        <p class="text-xs text-slate-400 font-bold mb-1">ما فهمه الميكروفون:</p>
        <p id="transcript-text" class="text-slate-700 font-bold"></p>
      </div>
    </div>

  </div>

  <script>
    // الآية المستهدفة (النص الخام مع التشكيل للعرض)
    const originalText = "قُلْ هُوَ اللَّهُ أَحَدٌ";

    // 1. تنظيف النص للمقارنة العادلة (إزالة التشكيل، توحيد الهمزات والياء)
    function normalizeArabic(text) {
      if (!text) return "";
      return text
        .replace(/[\u0617-\u061A\u064B-\u0652]/g, '') // إزالة التشكيل
        .replace(/[أإآا]/g, 'ا')                       // توحيد الألف
        .replace(/[يى]/g, 'ي')                        // توحيد الياء
        .replace(/[ةه]/g, 'ه')                        // توحيد التاء المربوطة
        .trim();
    }

    // 2. خوارزمية Levenshtein Distance لحساب نسبة التطابق
    function getSimilarity(s1, s2) {
      let longer = s1.length > s2.length ? s1 : s2;
      let shorter = s1.length > s2.length ? s2 : s1;
      let longerLength = longer.length;
      
      if (longerLength === 0) return 1.0;
      
      let costs = new Array();
      for (let i = 0; i <= s1.length; i++) {
        let lastValue = i;
        for (let j = 0; j <= s2.length; j++) {
          if (i == 0) {
            costs[j] = j;
          } else if (j > 0) {
            let newValue = costs[j - 1];
            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
              newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
            }
            costs[j - 1] = lastValue;
            lastValue = newValue;
          }
        }
        if (i > 0) costs[s2.length] = lastValue;
      }
      
      return (longerLength - costs[s2.length]) / parseFloat(longerLength);
    }

    // 3. إعداد Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const btn = document.getElementById('record-btn');
    const statusText = document.getElementById('status-text');
    const resultBox = document.getElementById('result-box');
    const scoreRing = document.getElementById('score-ring');
    const feedbackMsg = document.getElementById('feedback-msg');
    const transcriptText = document.getElementById('transcript-text');
    
    let isRecording = false;
    let recognition = null;

    if (!SpeechRecognition) {
      document.getElementById('unsupported-warning').classList.remove('hidden');
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.continuous = false; 
      recognition.interimResults = false;
      
      recognition.onstart = function() {
        isRecording = true;
        btn.classList.remove('bg-sky-500');
        btn.classList.add('bg-red-500', 'recording-pulse');
        statusText.textContent = "جاري الاستماع... (اقرأ الآية الآن)";
        resultBox.classList.add('hidden');
      };

      recognition.onspeechend = function() {
        recognition.stop();
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        handleResult(transcript);
      };

      recognition.onerror = function(event) {
        isRecording = false;
        resetBtnState();
        
        // معالجة حالة "الصمت" أو الخطأ
        if (event.error === 'no-speech') {
          showSilenceError();
        } else {
          statusText.textContent = "حدث خطأ في الميكروفون. حاول مجدداً.";
        }
      };

      recognition.onend = function() {
        if (isRecording) { // If it stopped without triggering onresult or onerror
          isRecording = false;
          resetBtnState();
          showSilenceError();
        }
      };
    }

    btn.addEventListener('click', () => {
      if (!recognition) return;
      
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });

    function resetBtnState() {
      btn.classList.remove('bg-red-500', 'recording-pulse');
      btn.classList.add('bg-sky-500');
    }

    function showSilenceError() {
      resultBox.classList.remove('hidden');
      scoreRing.className = "w-24 h-24 rounded-full border-8 border-slate-300 flex items-center justify-center text-3xl font-black text-slate-400";
      scoreRing.textContent = "؟";
      feedbackMsg.textContent = "لم أسمع شيئاً، هل يمكنك القراءة بصوت أعلى؟ 🎤";
      feedbackMsg.className = "text-xl font-black text-slate-500 text-center";
      transcriptText.textContent = "(لا يوجد صوت مسجل)";
      statusText.textContent = "جاهز للتسجيل مجدداً...";
    }

    function handleResult(transcript) {
      isRecording = false;
      resetBtnState();
      statusText.textContent = "تم التسجيل! شاهد النتيجة:";

      // مقارنة النصوص
      const targetNormalized = normalizeArabic(originalText);
      const transcriptNormalized = normalizeArabic(transcript);
      
      const similarity = getSimilarity(targetNormalized, transcriptNormalized);
      const percentage = Math.round(similarity * 100);

      // عرض النتائج
      resultBox.classList.remove('hidden');
      transcriptText.textContent = transcript;
      scoreRing.textContent = percentage + "%";

      scoreRing.className = "w-24 h-24 rounded-full border-8 flex items-center justify-center text-2xl font-black ";
      feedbackMsg.className = "text-2xl font-black text-center ";

      if (percentage >= 85) {
        scoreRing.classList.add('border-emerald-400', 'text-emerald-600');
        feedbackMsg.classList.add('text-emerald-600');
        feedbackMsg.innerHTML = "رائع! أحسنت التلاوة 🌟";
      } else if (percentage >= 50) {
        scoreRing.classList.add('border-amber-400', 'text-amber-600');
        feedbackMsg.classList.add('text-amber-600');
        feedbackMsg.innerHTML = "جيد جداً! حاول مرة أخرى لتتقن أكثر 💪";
      } else {
        scoreRing.classList.add('border-rose-400', 'text-rose-600');
        feedbackMsg.classList.add('text-rose-600');
        feedbackMsg.innerHTML = "أنت تقترب، حاول مرة أخرى 🎯";
      }
    }

  </script>
</body>
</html>
