<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقسِّم التلاوة التعليمية - أمين حاج أيوب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050a18;
            --bg2: #0c1328;
            --bg3: #111d3a;
            --gold: #d4a853;
            --gold2: #f0d48a;
            --gold3: #c49a3c;
            --blue: #4a9eff;
            --blue2: #2563eb;
            --green: #34d399;
            --green2: #10b981;
            --red: #f43f5e;
            --text: #e8edf5;
            --text2: #8a9bc0;
            --text3: #5a6a8a;
            --glass: rgba(12, 19, 40, 0.7);
            --glass2: rgba(20, 30, 60, 0.5);
            --border: rgba(212, 168, 83, 0.12);
            --glow: rgba(212, 168, 83, 0.25);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === خلفية متحركة بجسيمات === */
        #particles { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

        .wrap { position:relative; z-index:1; max-width:1300px; margin:0 auto; padding:16px; }

        /* === الهيدر === */
        .hdr {
            text-align:center;
            padding: 30px 10px 20px;
            background: linear-gradient(180deg, rgba(212,168,83,0.06) 0%, transparent 100%);
            border-radius: 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .hdr::before {
            content:'';
            position:absolute;
            top:-50%;left:-50%;width:200%;height:200%;
            background: conic-gradient(from 0deg, transparent 0%, rgba(212,168,83,0.03) 25%, transparent 50%);
            animation: hdrSpin 20s linear infinite;
        }
        @keyframes hdrSpin { to { transform:rotate(360deg); } }
        .hdr .bsm {
            font-family:'Amiri',serif;
            font-size:2rem;
            color:var(--gold);
            text-shadow: 0 0 30px rgba(212,168,83,0.3);
            position:relative;
            margin-bottom:10px;
        }
        .hdr h1 {
            font-size:2.2rem;
            font-weight:900;
            background: linear-gradient(135deg, var(--gold2), var(--gold), var(--gold3));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
            position:relative;
        }
        .hdr p { color:var(--text2); font-size:1rem; position:relative; margin-top:6px; }

        /* === البطاقات === */
        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 18px;
            transition: all 0.3s;
        }
        .card:hover { border-color: var(--glow); }
        .card-title {
            font-size:1.2rem; font-weight:700; color:var(--gold2);
            display:flex; align-items:center; gap:8px; margin-bottom:16px;
        }

        /* === منطقة التحميل === */
        .drop {
            border: 2px dashed var(--glow);
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }
        .drop::after {
            content:'';position:absolute;inset:0;
            background:radial-gradient(circle at center, rgba(212,168,83,0.04) 0%, transparent 70%);
            opacity:0; transition:opacity 0.4s;
        }
        .drop:hover, .drop.over { border-color:var(--gold); transform:translateY(-3px); box-shadow:0 8px 40px rgba(212,168,83,0.12); }
        .drop:hover::after, .drop.over::after { opacity:1; }
        .drop .ic { font-size:3rem; display:block; margin-bottom:10px; animation: bob 2.5s ease-in-out infinite; }
        @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .drop h3 { font-size:1.2rem; color:var(--gold2); margin-bottom:4px; position:relative; z-index:1; }
        .drop p { color:var(--text3); font-size:0.9rem; position:relative; z-index:1; }
        .drop input { display:none; }
