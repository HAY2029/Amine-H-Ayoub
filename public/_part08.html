
<script>
// ===== أسماء السور =====
const SURAH={1:'الفاتحة',36:'يس',37:'الصافات',38:'ص',39:'الزمر',40:'غافر',41:'فصلت',42:'الشورى',43:'الزخرف',44:'الدخان',45:'الجاثية',46:'الأحقاف',47:'محمد',48:'الفتح',49:'الحجرات',50:'ق',51:'الذاريات',52:'الطور',53:'النجم',56:'الواقعة',58:'المجادلة',59:'الحشر',60:'الممتحنة',61:'الصف',62:'الجمعة',63:'المنافقون',64:'التغابن',65:'الطلاق',66:'التحريم',67:'الملك',68:'القلم',69:'الحاقة',70:'المعارج',71:'نوح',72:'الجن',73:'المزمل',74:'المدثر',75:'القيامة',76:'الإنسان',77:'المرسلات',78:'النبأ',79:'النازعات',80:'عبس',81:'التكوير',82:'الانفطار',83:'المطففين',84:'الانشقاق',85:'البروج',86:'الطارق',87:'الأعلى',88:'الغاشية',89:'الفجر',90:'البلد',91:'الشمس',92:'الليل',93:'الضحى',94:'الشرح',95:'التين',96:'العلق',97:'القدر',98:'البينة',99:'الزلزلة',100:'العاديات',101:'القارعة',102:'التكاثر',103:'العصر',104:'الهمزة',105:'الفيل',106:'قريش',107:'الماعون',108:'الكوثر',109:'الكافرون',110:'النصر',111:'المسد',112:'الإخلاص',113:'الفلق',114:'الناس'};
function surahName(fn){ const n=parseInt(fn.replace(/\D/g,'')); return SURAH[n]?`سورة ${SURAH[n]} (${n})`:fn; }
function fmt(s){ if(!s||isNaN(s))return'0:00'; const m=Math.floor(s/60),ss=Math.floor(s%60); return m+':'+String(ss).padStart(2,'0'); }

// ===== الحالة =====
let actx=null, abuf=null, asrc=null, playing=false, segs=[], files=[], curIdx=-1;
let t0=0, tPause=0, af=null;

// ===== العناصر =====
const $=id=>document.getElementById(id);
const drop=$('drop'), finput=$('finput'), cvs=$('cvs'), cx=cvs.getContext('2d');

// ===== إعدادات تفاعلية =====
$('rThresh').oninput=function(){$('vThresh').textContent=this.value+' dB'};
$('rMinSil').oninput=function(){$('vMinSil').textContent=parseFloat(this.value).toFixed(1)+' ث'};
$('rMinSeg').oninput=function(){$('vMinSeg').textContent=parseFloat(this.value).toFixed(1)+' ث'};

// ===== تحميل الملفات =====
drop.onclick=()=>finput.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');loadFiles([...e.dataTransfer.files].filter(f=>f.name.endsWith('.mp3')||f.type.startsWith('audio/')))};
finput.onchange=e=>loadFiles([...e.target.files]);

function loadFiles(arr){
    if(!arr.length)return;
    files=arr.map(f=>({file:f,name:f.name,status:'p',segs:null}));
    files.sort((a,b)=>(parseInt(a.name.replace(/\D/g,''))||0)-(parseInt(b.name.replace(/\D/g,''))||0));
    renderFiles();
    $('secFiles').classList.remove('hide');$('secFiles').classList.add('show');
    toast(`✅ تم تحميل ${arr.length} ملف`);
}

function renderFiles(){
    $('fCnt').textContent=files.length;
    $('fGrid').innerHTML=files.map((f,i)=>`<div class="fItem ${f.status==='d'?'done':''} ${i===curIdx?'act':''}" onclick="proc(${i})"><span>${f.status==='d'?'✅':f.status==='w'?'⏳':'🎵'}</span><span>${surahName(f.name)}</span><span class="fBadge ${f.status}">${f.status==='d'?'تم ✓':f.status==='w'?'جاري...':'بانتظار'}</span></div>`).join('');
}
