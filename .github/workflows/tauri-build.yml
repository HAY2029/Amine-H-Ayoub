name: Build EXE MSI APK AAB Packages

# يعمل عند دفع إلى main أو وسم إصدار أو تشغيل يدوي
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════
#   يُنتج بالضبط 4 ملفات جاهزة للمتاجر:
#   ① Quran_1.0.0_Android_Mobile.aab   → Google Play Store (هاتف/جهاز لوحي)
#   ② Quran_1.0.0_Android_Mobile.apk   → توزيع مباشر (هاتف)
#   ③ Quran-Amine-H-Ayoub_1.0.0_Setup.exe         → ويندوز
#   ④ Quran-Amine-H-Ayoub_1.0.0_Microsoft_Store.msi → متجر مايكروسوفت
#
#   ملاحظة: تمت إزالة نسخة Android TV (Leanback) نهائياً — التطبيق للهاتف
#   والأجهزة اللوحية والكمبيوتر فقط.
# ═══════════════════════════════════════════════════════════════════

jobs:
  # ╔═══════════════════════════════════════════════╗
  # ║  1/3 — 💻 ويندوز: EXE + MSI                  ║
  # ╚═══════════════════════════════════════════════╝
  windows:
    name: "💻 Windows (EXE + MSI)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@^2

      - name: Generate app icon
        run: npx tauri icon src-tauri/icons/app-icon.png

      # بناء مباشر بدون tauri-action لتجنب رفع ملفات إضافية
      - name: Build Windows app (Tauri)
        run: npx tauri build

      - name: Prepare 2 Windows files
        shell: bash
        run: |
          mkdir -p dist-windows
          VERSION="1.0.0"

          EXE_FILE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -z "$EXE_FILE" ]; then
            EXE_FILE=$(find src-tauri/target/release/bundle -name "*.exe" -type f | head -1)
          fi
          MSI_FILE=$(find src-tauri/target/release/bundle/msi -name "*.msi" -type f 2>/dev/null | head -1)
          if [ -z "$MSI_FILE" ]; then
            MSI_FILE=$(find src-tauri/target/release/bundle -name "*.msi" -type f | head -1)
          fi

          if [ -n "$EXE_FILE" ]; then
            cp "$EXE_FILE" "dist-windows/Quran-Amine-H-Ayoub_${VERSION}_Setup.exe"
            echo "✅ EXE: $(du -h "dist-windows/Quran-Amine-H-Ayoub_${VERSION}_Setup.exe" | cut -f1)"
          else
            echo "::error::No EXE found!"
          fi

          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" "dist-windows/Quran-Amine-H-Ayoub_${VERSION}_Microsoft_Store.msi"
            echo "✅ MSI: $(du -h "dist-windows/Quran-Amine-H-Ayoub_${VERSION}_Microsoft_Store.msi" | cut -f1)"
          else
            echo "::error::No MSI found!"
          fi

          echo "=== Windows files (2/6) ==="
          ls -lh dist-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-files
          if-no-files-found: error
          path: dist-windows/*

  # ╔═══════════════════════════════════════════════╗
  # ║  2/3 — 📱 أندرويد هاتف: AAB + APK             ║
  # ╚═══════════════════════════════════════════════╝
  android-mobile:
    name: "📱 Android Mobile (AAB + APK)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/platforms /usr/local/lib/android/sdk/build-tools/3[0-2]* /opt/ghc
          sudo apt-get clean
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm install -D @tauri-apps/cli@^2

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Inject custom app icon
        run: |
          npx tauri icon src-tauri/icons/app-icon.png
          mkdir -p src-tauri/gen/android/app/src/main/res
          cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true

      - name: Build Mobile APK
        run: npx tauri android build --apk --target aarch64

      - name: Build Mobile AAB (Google Play Bundle)
        run: npx tauri android build --aab --target aarch64

      - name: Prepare and sign 2 Mobile files (AAB + APK)
        run: |
          VERSION="1.0.0"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)"
          mkdir -p dist-mobile

          # إنشاء مفتاح التوقيع
          KEYSTORE="${{ runner.temp }}/release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias "quran" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "quran2026" -keypass "quran2026" \
            -dname "CN=QuranKids, OU=App, O=QuranKids, L=Algiers, ST=Algiers, C=DZ"

          # ① توقيع APK
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find src-tauri -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          echo "Found Mobile APK: $RAW_APK"
          if [ -n "$RAW_APK" ]; then
            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" "dist-mobile/Quran_${VERSION}_Android_Mobile.apk"
            "$BUILD_TOOLS_DIR/apksigner" sign --ks "$KEYSTORE" --ks-pass "pass:quran2026" "dist-mobile/Quran_${VERSION}_Android_Mobile.apk"
            echo "✅ Mobile APK signed"
          else
            echo "::error::No Mobile APK found!"
            exit 1
          fi

          # ② توقيع AAB
          RAW_AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*release*.aab" -type f 2>/dev/null | head -1)
          if [ -z "$RAW_AAB" ]; then
            RAW_AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$RAW_AAB" ]; then
            RAW_AAB=$(find src-tauri -name "*.aab" -type f 2>/dev/null | head -1)
          fi
          echo "Found Mobile AAB: $RAW_AAB"
          if [ -n "$RAW_AAB" ]; then
            cp "$RAW_AAB" "dist-mobile/Quran_${VERSION}_Android_Mobile.aab"
            jarsigner -keystore "$KEYSTORE" -storepass "quran2026" -keypass "quran2026" "dist-mobile/Quran_${VERSION}_Android_Mobile.aab" "quran"
            echo "✅ Mobile AAB signed"
          else
            echo "::error::No Mobile AAB found!"
            exit 1
          fi

          echo "=== Mobile files (2/6) ==="
          ls -lh dist-mobile/

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile-files
          if-no-files-found: error
          path: dist-mobile/*

  # ╔═══════════════════════════════════════════════════════════════╗
  # ║  🚀 النشر: رفع الملفات إلى GitHub Release عند إنشاء tag     ║
  # ╚═══════════════════════════════════════════════════════════════╝
  publish:
    name: "🚀 Publish Store-Ready Files"
    needs: [windows, android-mobile]
    if: needs.windows.result == 'success' && needs.android-mobile.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # تحميل جميع artifacts من الوظائف الثلاث
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Collect all files into one folder
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.aab" -o -name "*.apk" \) -exec cp {} release-files/ \;

          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║     📦 Store-Ready Files for v1.0.0          ║"
          echo "╠══════════════════════════════════════════════╣"

          COUNT=0
          for f in release-files/*; do
            COUNT=$((COUNT+1))
            SIZE=$(du -h "$f" | cut -f1)
            NAME=$(basename "$f")
            echo "║  $COUNT. $NAME ($SIZE)"
          done

          echo "╠══════════════════════════════════════════════╣"
          echo "║  Total: $COUNT files                         ║"
          echo "╚══════════════════════════════════════════════╝"

          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No files found to publish!"
            exit 1
          fi

      # حذف جميع الملفات القديمة من الإصدار ورفع الملفات الجديدة
      - name: Clean old assets and upload files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          # إنشاء release إذا لم يكن موجوداً
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Quran-Amine H Ayoub $TAG" \
              --notes "المصحف المرتل برواية ورش — القارئ الشيخ حاج أيوب أمين" \
              --latest

          # حذف جميع الملفات القديمة
          echo "🗑️ Removing old assets..."
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true)
          if [ -n "$ASSETS" ]; then
            echo "$ASSETS" | while IFS= read -r name; do
              if [ -n "$name" ]; then
                echo "  Deleting: $name"
                gh release delete-asset "$TAG" "$name" --yes 2>/dev/null || true
              fi
            done
          fi

          # رفع الملفات الجديدة
          echo ""
          echo "📤 Uploading store-ready files..."
          gh release upload "$TAG" release-files/* --clobber

          # تحديث عنوان الإصدار
          gh release edit "$TAG" \
            --title "Quran-Amine H Ayoub $TAG" \
            --notes "المصحف المرتل برواية ورش — القارئ الشيخ حاج أيوب أمين

          📱 Google Play (هاتف/لوحي): Quran_1.0.0_Android_Mobile.aab
          🤖 APK مباشر (هاتف): Quran_1.0.0_Android_Mobile.apk
          💻 ويندوز: Quran-Amine-H-Ayoub_1.0.0_Setup.exe
          🏪 متجر مايكروسوفت: Quran-Amine-H-Ayoub_1.0.0_Microsoft_Store.msi"

          echo ""
          echo "✅ Release $TAG updated!"

      # رفع إلى HuggingFace
      - name: Upload files to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "⚠️ HF_TOKEN not set, skipping Hugging Face upload"
            exit 0
          fi

          for f in release-files/*; do
            FNAME=$(basename "$f")
            echo "📤 Uploading $FNAME to HuggingFace..."
            curl -f -X PUT \
              -H "Authorization: Bearer $HF_TOKEN" \
              -T "$f" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/$FNAME" || \
            echo "⚠️ Failed to upload $FNAME (non-fatal)"
          done
          echo "✅ HuggingFace upload complete"
