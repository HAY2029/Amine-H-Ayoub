<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مولّد إطارات جوجل بلاي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap');
    
    body {
      font-family: 'Cairo', sans-serif;
      background: #eee;
      padding: 20px;
      text-align: center;
    }
    
    #container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .frame-wrapper {
      width: 540px; /* Half of 1080 */
      height: 960px; /* Half of 1920 */
      background: linear-gradient(135deg, #FDFBF7 0%, #D2B48C 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    .text-container {
      margin-top: 75px;
      margin-bottom: 40px;
      text-align: center;
      width: 450px;
      z-index: 20;
    }

    .title {
      font-size: 42px;
      color: #5D4037;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      line-height: 1.3;
    }

    .phone-frame {
      width: 414px;
      height: 725px;
      background: #000;
      border-radius: 30px;
      padding: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 0 10px rgba(255,255,255,0.5);
      position: relative;
      box-sizing: border-box;
      z-index: 20;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 20px;
      background: #000;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      z-index: 30;
    }

    .screenshot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    
    .decoration {
      position: absolute;
      font-size: 75px;
      opacity: 0.1;
      color: #fff;
      z-index: 10;
    }
    
    .star1 { top: 50px; left: 50px; }
    .star2 { top: 150px; right: 40px; font-size: 50px; }
    .moon { bottom: 100px; left: 60px; font-size: 100px; }
    
    button {
      padding: 15px 30px;
      font-size: 20px;
      background: #D2B48C;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 20px;
      font-family: 'Cairo', sans-serif;
      font-weight: bold;
    }
    button:hover {
      background: #c1a37b;
    }
  </style>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
  
  <h1>مولّد إطارات جوجل بلاي</h1>
  <p>اضغط على الزر أدناه لتوليد وتحميل الصور بالدقة العالية (1080x1920)</p>
  <button onclick="generateAndDownload()">توليد وتحميل الصور 🖼️</button>

  <div id="container"></div>

  <script>
    const screens = [
      { file: 'screenshot-01-main-page.png', text: 'تلاوات وحفظ القرآن بطريقة ممتعة' },
      { file: 'screenshot-02-games.png', text: 'ألعاب تعليمية شيقة للمكافأة' },
      { file: 'screenshot-03-shop.png', text: 'متجر شخصيات أبطال القرآن' },
      { file: 'screenshot-04-settings.png', text: 'إعدادات مخصصة لحماية طفلك' },
      { file: 'screenshot-05-parent-dashboard.png', text: 'لوحة متكاملة لمتابعة إنجازات طفلك' }
    ];

    const container = document.getElementById('container');
    
    // Create DOM elements
    screens.forEach((screen, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'frame-wrapper';
      wrapper.id = 'frame-' + index;
      
      wrapper.innerHTML = `
        <div class="decoration star1">★</div>
        <div class="decoration star2">✦</div>
        <div class="decoration moon">🌙</div>
        
        <div class="text-container">
          <div class="title">${screen.text}</div>
        </div>
        
        <div class="phone-frame">
          <div class="notch"></div>
          <div class="phone-screen">
            <!-- Ensure images are in the public/screenshots folder for this to work -->
            <img class="screenshot" src="/google-play-assets/screenshots/${screen.file}" crossorigin="anonymous">
          </div>
        </div>
      `;
      container.appendChild(wrapper);
    });

    async function generateAndDownload() {
      const wrappers = document.querySelectorAll('.frame-wrapper');
      for (let i = 0; i < wrappers.length; i++) {
        const wrapper = wrappers[i];
        
        // Use html2canvas to render the wrapper
        const canvas = await html2canvas(wrapper, {
          scale: 2, // 2x scale turns 540x960 into 1080x1920
          useCORS: true,
          backgroundColor: null
        });
        
        // Download image
        const link = document.createElement('a');
        link.download = \`framed-\${screens[i].file}\`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        // Wait a bit between downloads
        await new Promise(r => setTimeout(r, 500));
      }
      alert('تم تحميل جميع الصور بنجاح! تفقد مجلد التنزيلات.');
    }
  </script>
</body>
</html>
